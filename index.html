<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Masa Build</title>
  <meta name="description" content="Masa Build owns Pact App Ltd, building Pact and Moat." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ECEAE5;
      --bg-card: #FFFFFF;
      --text: #16272E;
      --text2: #4D5F66;
      --text3: #8A9AA0;
      --text-inv: #FFFFFF;
      --accent: #5B8A98;
      --accent-deep: #3E6878;
      --border2: rgba(26, 43, 50, 0.15);
      --r-md: 10px;
      --r-xl: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 15% 18%, rgba(91, 138, 152, 0.18), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(91, 138, 152, 0.15), transparent 45%),
        radial-gradient(rgba(26, 43, 50, 0.08) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 22px 22px;
      background-attachment: fixed;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--bg-card);
      border-radius: var(--r-xl);
      padding: 40px;
      box-shadow: 0 1px 2px rgba(22, 39, 46, 0.04), 0 12px 32px rgba(22, 39, 46, 0.08);
    }

    .eyebrow {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-deep);
      margin-bottom: 14px;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 14px;
    }

    p.lede {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text2);
      margin-bottom: 28px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-radius: var(--r-md);
      border: 1px solid var(--border2);
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .links a:hover {
      border-color: var(--accent);
      background: rgba(91, 138, 152, 0.06);
    }

    .links a .name {
      font-size: 16px;
      font-weight: 700;
    }

    .links a .arrow {
      color: var(--accent-deep);
      font-size: 18px;
    }

    footer {
      margin-top: 32px;
      font-size: 13px;
      color: var(--text3);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Masa Build</div>
    <h1>We're the owners of Pact App Ltd.</h1>
    <p class="lede">We build Pact, a habit app for committing to goals with friends, and Moat, a network for founders.</p>
    <div class="links">
      <a href="https://makethepact.app/">
        <span class="name">Pact</span>
        <span class="arrow">&rarr;</span>
      </a>
      <a href="https://foundersmoat.com">
        <span class="name">Moat</span>
        <span class="arrow">&rarr;</span>
      </a>
    </div>
    <footer>&copy; Masa Build</footer>
  </main>
</body>
</html>
